<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colsam-Sport | Juegos Intercursos</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --detalles-beige: #d4c9be;
            --acento-azul: #123458;
            --texto-oscuro: #030303;
            --blanco-puro: #ffffff;
        }

        body {
            background-color: var(--blanco-puro);
            color: var(--texto-oscuro);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .bg-azul-colsam { background-color: var(--acento-azul); }
        .text-azul-colsam { color: var(--acento-azul); }
        .border-azul-colsam { border-color: var(--acento-azul); }
        
        .bg-beige-colsam { background-color: var(--detalles-beige); }
        .text-beige-colsam { color: var(--detalles-beige); }
        .text-oscuro-colsam { color: var(--texto-oscuro); }
        
        .tab-active {
            background-color: var(--acento-azul);
            color: var(--blanco-puro);
            border-color: var(--acento-azul);
        }
        
        .tab-inactive {
            background-color: var(--blanco-puro);
            color: var(--acento-azul);
            border-color: var(--detalles-beige);
        }

        .tab-inactive:hover {
            background-color: var(--detalles-beige);
            color: var(--texto-oscuro);
        }

        .card-resultado {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .card-resultado:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(18, 52, 88, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Encabezado -->
    <header class="bg-azul-colsam text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <i data-lucide="trophy" class="w-8 h-8 text-beige-colsam"></i>
                    <div>
                        <h1 class="text-3xl font-bold tracking-tight text-white">Colsam-Sport</h1>
                        <p class="text-sm text-beige-colsam font-medium uppercase tracking-wider">Juegos Intercursos Oficiales</p>
                    </div>
                </div>
                <div class="hidden sm:flex items-center gap-2 bg-white/10 px-4 py-2 rounded-lg">
                    <i data-lucide="calendar" class="w-5 h-5 text-beige-colsam"></i>
                    <span class="text-sm font-semibold text-white">Temporada 2026</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-8">
        <!-- Pestañas de Filtro -->
        <div class="mb-8 flex flex-wrap justify-center gap-3 border-b-2 border-beige-colsam pb-4">
            <button onclick="filtrarDeporte('todos')" id="tab-todos" class="tab-active px-6 py-2 rounded-full font-bold text-sm transition-colors border-2 shadow-sm flex items-center gap-2">
                <i data-lucide="layout-grid" class="w-4 h-4"></i> Todos
            </button>
            <button onclick="filtrarDeporte('futsal')" id="tab-futsal" class="tab-inactive px-6 py-2 rounded-full font-bold text-sm transition-colors border-2 shadow-sm flex items-center gap-2">
                <i data-lucide="goal" class="w-4 h-4"></i> Futsal
            </button>
            <button onclick="filtrarDeporte('balonmano')" id="tab-balonmano" class="tab-inactive px-6 py-2 rounded-full font-bold text-sm transition-colors border-2 shadow-sm flex items-center gap-2">
                <i data-lucide="hand" class="w-4 h-4"></i> Balonmano
            </button>
            <button onclick="filtrarDeporte('voleibol')" id="tab-voleibol" class="tab-inactive px-6 py-2 rounded-full font-bold text-sm transition-colors border-2 shadow-sm flex items-center gap-2">
                <i data-lucide="orbit" class="w-4 h-4"></i> Voleibol
            </button>
        </div>

        <!-- Grilla de Resultados -->
        <div id="resultados-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-beige-colsam border-t border-gray-200 mt-auto">
        <div class="max-w-5xl mx-auto px-4 py-6 text-center">
            <p class="text-oscuro-colsam font-medium">© 2026 Colsam-Sport. Desarrollado para los Juegos Intercursos.</p>
            <p class="text-sm text-oscuro-colsam/70 mt-1">Fomentando el deporte y la sana convivencia.</p>
        </div>
    </footer>

    <!-- Lógica JavaScript -->
    <script>
        lucide.createIcons();

        const partidos = [
            { id: 1, deporte: 'futsal', equipo1: '11° A', equipo2: '11° B', goles1: 4, goles2: 2, fecha: '25 May, 08:00 AM', estado: 'finalizado' },
            { id: 2, deporte: 'futsal', equipo1: '10° C', equipo2: '10° A', goles1: 1, goles2: 1, fecha: '25 May, 09:30 AM', estado: 'finalizado' },
            { id: 3, deporte: 'balonmano', equipo1: '9° B', equipo2: '9° C', goles1: 15, goles2: 12, fecha: '26 May, 08:00 AM', estado: 'finalizado' },
            { id: 4, deporte: 'voleibol', equipo1: '11° C', equipo2: '10° B', goles1: 2, goles2: 0, fecha: '27 May, 10:00 AM', estado: 'finalizado' },
            { id: 5, deporte: 'futsal', equipo1: '8° A', equipo2: '8° B', goles1: '-', goles2: '-', fecha: 'Hoy, 14:00 PM', estado: 'proximo' },
            { id: 6, deporte: 'balonmano', equipo1: '11° A', equipo2: '10° C', goles1: 8, goles2: 5, fecha: 'Hoy, En curso', estado: 'en_curso' },
            { id: 7, deporte: 'voleibol', equipo1: '9° A', equipo2: '8° C', goles1: '-', goles2: '-', fecha: 'Mañana, 09:00 AM', estado: 'proximo' }
        ];

        function getDeporteInfo(deporte) {
            switch(deporte) {
                case 'futsal': return { icono: 'goal', nombre: 'Futsal' };
                case 'balonmano': return { icono: 'hand', nombre: 'Balonmano' };
                case 'voleibol': return { icono: 'orbit', nombre: 'Voleibol' };
                default: return { icono: 'trophy', nombre: 'Deporte' };
            }
        }

        function renderEstado(estado) {
            if (estado === 'finalizado') {
                return `<span class="px-2 py-1 bg-beige-colsam text-oscuro-colsam text-xs font-bold rounded-md">Finalizado</span>`;
            } else if (estado === 'en_curso') {
                return `<span class="px-2 py-1 bg-azul-colsam text-white text-xs font-bold rounded-md animate-pulse flex items-center gap-1"><span class="w-1.5 h-1.5 bg-red-400 rounded-full"></span> En Curso</span>`;
            } else {
                return `<span class="px-2 py-1 bg-gray-100 text-gray-600 border border-gray-200 text-xs font-bold rounded-md">Próximo</span>`;
            }
        }

        function renderizarPartidos(filtroDeporte) {
            const container = document.getElementById('resultados-container');
            container.innerHTML = '';

            const partidosFiltrados = filtroDeporte === 'todos' 
                ? partidos 
                : partidos.filter(p => p.deporte === filtroDeporte);

            if (partidosFiltrados.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-10 bg-gray-50 rounded-xl border-2 border-dashed border-beige-colsam">
                        <i data-lucide="calendar-x" class="w-12 h-12 mx-auto text-gray-400 mb-3"></i>
                        <p class="text-oscuro-colsam font-medium text-lg">No hay partidos programados para este deporte.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            partidosFiltrados.forEach(partido => {
                const info = getDeporteInfo(partido.deporte);
                const gana1 = partido.estado === 'finalizado' && partido.goles1 > partido.goles2;
                const gana2 = partido.estado === 'finalizado' && partido.goles2 > partido.goles1;

                const card = document.createElement('div');
                card.className = 'card-resultado bg-white rounded-xl border border-gray-200 overflow-hidden flex flex-col';
                
                card.innerHTML = `
                    <div class="bg-beige-colsam/30 px-4 py-2 border-b border-gray-100 flex justify-between items-center">
                        <div class="flex items-center gap-2 text-azul-colsam font-bold text-sm">
                            <i data-lucide="${info.icono}" class="w-4 h-4"></i>
                            ${info.nombre}
                        </div>
                        <div class="text-xs font-medium text-gray-500">${partido.fecha}</div>
                    </div>
                    
                    <div class="p-5 flex-grow flex flex-col justify-center gap-4">
                        <div class="flex justify-between items-center">
                            <span class="text-lg font-bold ${gana1 ? 'text-azul-colsam' : 'text-oscuro-colsam'}">${partido.equipo1}</span>
                            <span class="text-2xl font-black ${gana1 ? 'text-azul-colsam' : 'text-gray-400 bg-gray-50 px-3 rounded-md'}">${partido.goles1}</span>
                        </div>
                        
                        <div class="relative flex py-1 items-center">
                            <div class="flex-grow border-t border-beige-colsam"></div>
                            <span class="flex-shrink-0 mx-4 text-gray-300 text-xs font-bold uppercase tracking-widest">VS</span>
                            <div class="flex-grow border-t border-beige-colsam"></div>
                        </div>

                        <div class="flex justify-between items-center">
                            <span class="text-lg font-bold ${gana2 ? 'text-azul-colsam' : 'text-oscuro-colsam'}">${partido.equipo2}</span>
                            <span class="text-2xl font-black ${gana2 ? 'text-azul-colsam' : 'text-gray-400 bg-gray-50 px-3 rounded-md'}">${partido.goles2}</span>
                        </div>
                    </div>

                    <div class="px-4 py-3 bg-gray-50 border-t border-gray-100 flex justify-between items-center">
                        ${renderEstado(partido.estado)}
                        <button class="text-xs font-bold text-azul-colsam hover:underline focus:outline-none">
                            Ver detalles
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });

            lucide.createIcons();
        }

        function filtrarDeporte(deporte) {
            const tabs = ['todos', 'futsal', 'balonmano', 'voleibol'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === deporte) {
                    btn.classList.remove('tab-inactive');
                    btn.classList.add('tab-active');
                } else {
                    btn.classList.remove('tab-active');
                    btn.classList.add('tab-inactive');
                }
            });
            renderizarPartidos(deporte);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderizarPartidos('todos');
        });
    </script>
</body>
</html>
